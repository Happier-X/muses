[versions]
# 与旧工程 android/ 保持同一版本线（已在本机验证可解析）
agp = "9.3.2"
kotlin = "2.4.10"
compose-multiplatform = "1.12.0-rc01"
ksp = "2.3.12"
# P2a Hilt→Koin：BOM 统一版本（AC3），各工件不散装版本号
koin-bom = "4.2.0"
# SDK 与工具链单源（各模块 android{} 统一引用，升降级只改此处）
compileSdk = "37"
minSdk = "26"
minSdkApp = "29"
targetSdk = "36"
jvmTarget = "17"

androidxCore = "1.19.0"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
# CMP Navigation 已切 miuix-nav，版本号删除
lifecycle = "2.11.0"
media3 = "1.11.0"
okhttp = "5.5.0"
# P2c Ktor-client（CIO）：3.5.x 线 S0 spike 实测锁定 3.5.2
# （mavenCentral 200 验证：client-core/cio/mock 全构件存在；传递 coroutines 1.11.0 与本项目一致）
ktor = "3.5.2"
# Ktor 3.5.2 官方传递版本（ktor-io-jvm POM 实测）：kotlinx.io.IOException 供给
kotlinxIo = "0.9.1"
coil = "3.5.0"
room = "2.8.4"
sqlite = "2.6.2"
okio = "3.9.0"
datastore = "1.2.1"
coroutines = "1.11.0"
junit = "4.13.2"
jaudiotagger = "3.0.1"
vlcj = "4.8.2"
workManager = "2.11.2"
robolectric = "4.16"
androidxTestCore = "1.7.0"
# M3 刮削引擎：DataStore JSON snapshot 序列化
kotlinxSerialization = "1.9.0"
tablerIcons = "2.2.1"
jna = "5.17.0"
# miuix（小米 HyperOS 风格 CMP 组件库）：0.9.4-rc01 按 CMP 1.12.0-rc01 + Kotlin 2.4.10 构建
#（.module 实测），与本工程版本线精确对齐
miuix = "0.9.4-rc01"

[libraries]
# U24：accompanist-lyrics-core 依赖摘除（唯一消费者 AmllMapper 死代码已随 U21 删除）
# 歌词渲染层 lyrics-ui 已 vendor 为源码引入，不再作为外部依赖 —— 见 docs/THIRD_PARTY.md
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
# Tabler Icons：KMP 侧统一用 -cmp 父件（含 android+jvm 变体）；-cmp-android 死坐标已删除
# 纠偏：design 原写 `-desktop`，中央仓库真实产物为 `-cmp`（KMP 父件，含 android+jvm 变体），同 2.2.1
tabler-icons-cmp = { group = "com.composables", name = "icons-tabler-outline-cmp", version.ref = "tablerIcons" }
tabler-filled-icons-cmp = { group = "com.composables", name = "icons-tabler-filled-cmp", version.ref = "tablerIcons" }
# Coil 桌面网络引擎：3.5.0 线真实产物为 ktor3（design 原写的 coil-network-ktor 止于 3.0.0-alpha08）
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# U9：ViewModel/viewModelScope KMP 工件（2.8+ 官方多平台），feature:library commonMain 消费
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
# navigation-compose 已切 miuix-nav，jetbrains 坐标删除（见 feature/shell 注释）

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# P2a：Koin 4.2.0 BOM（CMP 就绪，P3 复用；无 version 经 BOM 统一）
# Koin 工件显式挂 4.2.0（与 BOM 同线）：KMP sourceSets 依赖处理器不支持 platform(BOM)，
# feature:library/composeApp 的 commonMain 需直连版本（安卓侧仍走 BOM，同一版本线无冲突）
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin-bom" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin-bom" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin-bom" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin-bom" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin-bom" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# P2c Ktor-client（AC4：版本经 BOM 统一，无散装版本；S0 锁定 3.5.2）
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
# U11：KMP sourceSets 不支持 platform(BOM)，core:webdav commonMain 直连 3.5.2（与 BOM 同线）
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
# Ktor 3.5.2 官方传递版本（S0 实测 ktor-io-jvm POM）：kotlinx.io.IOException 供给
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinxIo" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Coil 3 远程图片需显式网络引擎（否则 AsyncImage 加载 https 静默失败）；okhttp 实现与项目 OkHttp 版本线一致
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# 桌面 Dispatchers.Main 提供者：CMP 1.12 起 compose.desktop.currentOs 不再传递 javafx dispatcher，须显式声明
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }

jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version.ref = "jaudiotagger" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# M3 刮削引擎：localStorage snapshot → DataStore JSON（S3/S4 使用）
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# miuix KMP 父件（含 android+jvm 变体，Gradle 按 target 解析；同 tabler-cmp 模式）
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference", version.ref = "miuix" }
# miuix-nav（自研 CMP 导航运行时：连续栈深度+HyperOS 转场+跟手返回；与 miuix-ui 同版本线）
miuix-nav = { group = "top.yukonga.miuix.kmp", name = "miuix-nav", version.ref = "miuix" }
# miuix-blur（HyperOS 模糊效果库：LayerBackdrop/textureBlur/渐进模糊；Android 需 API 33+，
# 低版本经 isRuntimeShaderSupported() 门控降级；与 miuix-ui 同版本线）
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur", version.ref = "miuix" }
# miuix-squircle（连续曲率平滑圆角：squircleClip/Background/Border；shader 变体 Android API 33+，
# 低版本自动回退 RoundedCornerShape；miuix-ui 对其仅 runtime 传递，使用方需显式声明）
miuix-squircle = { group = "top.yukonga.miuix.kmp", name = "miuix-squircle", version.ref = "miuix" }
# miuix-shader（isRuntimeShaderSupported 等 RuntimeShader 能力检查；miuix-blur 对其不透传，需直连）
miuix-shader = { group = "top.yukonga.miuix.kmp", name = "miuix-shader", version.ref = "miuix" }

# S1 桌面凭据：Windows DPAPI 经 JNA（jna-platform 含 Crypt32Util；版本与 Gradle 自带 jna 5.17.0 对齐）
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }

# P3-S2 桌面解码：VLCJ 只进 :desktop 纯 JVM 模块，禁止进 :core:common（GPL 系见任务 spike.md §2，D1 已接受）
vlcj = { group = "uk.co.caprica", name = "vlcj", version.ref = "vlcj" }

# 依赖组：6 个 feature 的 KMP 注入对（core + compose-viewmodel）只收敛一处
[bundles]
koin-kmp = ["koin-core", "koin-compose-viewmodel"]
# 安卓侧注入对（BOM 约束不能进组，仍逐处声明 platform；工件对收敛此处）
koin-android-set = ["koin-core", "koin-android"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# P3-S3：JetBrains Compose Multiplatform 桌面插件（桌面窗口/打包/Skia 渲染）
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
# miuix-nav 路由 @Serializable 需要（与 kotlin 同版本线，插件版本必须跟 kotlin 走）
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[versions]
# 与旧工程 android/ 保持同一版本线（已在本机验证可解析）
agp = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.11"
# P2a Hilt→Koin：BOM 统一版本（AC3），各工件不散装版本号
koin-bom = "4.2.0"

androidxCore = "1.19.0"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
lifecycle = "2.11.0"
media3 = "1.11.0"
okhttp = "5.5.0"
# P2c Ktor-client（CIO）：3.5.x 线 S0 spike 实测锁定 3.5.2
# （mavenCentral 200 验证：client-core/cio/mock 全构件存在；传递 coroutines 1.11.0 与本项目一致）
ktor = "3.5.2"
# Ktor 3.5.2 官方传递版本（ktor-io-jvm POM 实测）：kotlinx.io.IOException 供给
kotlinxIo = "0.9.1"
coil = "3.5.0"
room = "2.8.4"
sqlite = "2.6.2"
okio = "3.9.0"
datastore = "1.2.1"
coroutines = "1.11.0"
junit = "4.13.2"
jaudiotagger = "3.0.1"
vlcj = "4.8.2"
workManager = "2.11.2"
robolectric = "4.16"
androidxTestCore = "1.7.0"
accompanistLyricsCore = "0.4.7"
# M3 刮削引擎：DataStore JSON snapshot 序列化
kotlinxSerialization = "1.9.0"
haze = "2.0.0-alpha05"
tablerIcons = "2.2.1"
jna = "5.17.0"

[libraries]
# M2：仅解析用（TTML/LRC → SyncedLyrics），不引入 lyrics-ui 渲染层
accompanist-lyrics-core = { group = "com.mocharealm.accompanist", name = "lyrics-core", version.ref = "accompanistLyricsCore" }
# 歌词渲染层 lyrics-ui 已 vendor 为源码引入，不再作为外部依赖 —— 见 docs/THIRD_PARTY.md
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
# Tabler Icons（outline；注意必须用 cmp-android 才有 ImageVector，纯 android 只有 VectorDrawable）
tabler-icons = { group = "com.composables", name = "icons-tabler-outline-cmp-android", version.ref = "tablerIcons" }
# Tabler Filled Icons（官方带圆角 fill，替换手写 FillIcons）
tabler-filled-icons = { group = "com.composables", name = "icons-tabler-filled-cmp-android", version.ref = "tablerIcons" }
# U0 地基新增（09-04-kmp-ui-shared）：KMP 共通坐标，现有 -cmp-android / okhttp 坐标不动
# 纠偏：design 原写 `-desktop`，中央仓库真实产物为 `-cmp`（KMP 父件，含 android+jvm 变体），同 2.2.1
tabler-icons-cmp = { group = "com.composables", name = "icons-tabler-outline-cmp", version.ref = "tablerIcons" }
tabler-filled-icons-cmp = { group = "com.composables", name = "icons-tabler-filled-cmp", version.ref = "tablerIcons" }
# Coil 桌面网络引擎：3.5.0 线真实产物为 ktor3（design 原写的 coil-network-ktor 止于 3.0.0-alpha08）
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# P2a：Koin 4.2.0 BOM（CMP 就绪，P3 复用；无 version 经 BOM 统一）
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin-bom" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }
koin-androidx-compose-navigation = { group = "io.insert-koin", name = "koin-androidx-compose-navigation" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# P2c Ktor-client（AC4：版本经 BOM 统一，无散装版本；S0 锁定 3.5.2）
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock" }
# Ktor 3.5.2 官方传递版本（S0 实测 ktor-io-jvm POM）：kotlinx.io.IOException 供给
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinxIo" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Coil 3 远程图片需显式网络引擎（否则 AsyncImage 加载 https 静默失败）；okhttp 实现与项目 OkHttp 版本线一致
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version.ref = "jaudiotagger" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# M3 刮削引擎：localStorage snapshot → DataStore JSON（S3/S4 使用）
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }

# S1 桌面凭据：Windows DPAPI 经 JNA（jna-platform 含 Crypt32Util；版本与 Gradle 自带 jna 5.17.0 对齐）
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }

# P3-S2 桌面解码：VLCJ 只进 :desktop 纯 JVM 模块，禁止进 :core:common（GPL 系见任务 spike.md §2，D1 已接受）
vlcj = { group = "uk.co.caprica", name = "vlcj", version.ref = "vlcj" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# P3-S3：JetBrains Compose Multiplatform 桌面插件（桌面窗口/打包/Skia 渲染）
compose-multiplatform = { id = "org.jetbrains.compose", version = "1.12.0-rc01" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/muses-release.keystore

      # 签名与版本号经 AGP injected properties 注入：
      # versionName=tag；versionCode=提交总数（单调递增，须不低于旧 Capacitor 版）
      - name: Build muses APK (com.muses.player)
        run: |
          cd native
          chmod +x gradlew
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew :app:assembleMusesRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/muses-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.versionName=${{ steps.version.outputs.version }} \
            -Pandroid.injected.versionCode=$VERSION_CODE

      - name: Rename muses APK
        run: |
          mv native/app/build/outputs/apk/muses/release/app-muses-release.apk \
             muses-v${{ steps.version.outputs.version }}.apk

      - name: Build miui APK (com.miui.player)
        run: |
          cd native
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew :app:assembleMiuiRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/muses-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.versionName=${{ steps.version.outputs.version }} \
            -Pandroid.injected.versionCode=$VERSION_CODE

      - name: Rename miui APK
        run: |
          mv native/app/build/outputs/apk/miui/release/app-miui-release.apk \
             muses-v${{ steps.version.outputs.version }}-mi.apk

      - name: Read changelog
        id: changelog
        run: |
          CHANGELOG_FILE="changelog/v${{ steps.version.outputs.version }}.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            cat "$CHANGELOG_FILE" >> release_body.md
          else
            echo "> 暂无更新日志" >> release_body.md
          fi
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "### 构建产物" >> release_body.md
          echo "- \`muses-v${{ steps.version.outputs.version }}.apk\` — 原生 Kotlin + Jetpack Compose（包名 \`com.muses.player\`）" >> release_body.md
          echo "- \`muses-v${{ steps.version.outputs.version }}-mi.apk\` — 包名 \`com.miui.player\`" >> release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release_body.md
          files: |
            muses-v${{ steps.version.outputs.version }}.apk
            muses-v${{ steps.version.outputs.version }}-mi.apk

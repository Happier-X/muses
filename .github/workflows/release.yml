name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 安卓双渠道签名 APK：ubuntu 构建，产物经 artifact 交给 release 汇总
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Gradle 依赖与 wrapper 缓存：跳过每次冷启动的全量下载
          cache: 'gradle'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/muses-release.keystore

      # 签名与版本号经 AGP injected properties 注入：
      # versionName=tag；versionCode=提交总数（单调递增，须不低于旧 Capacitor 版）
      # 双渠道一条命令构建：共享配置阶段与 compile 任务，较两次独立构建显著提速
      - name: Build signed APKs (muses + miui)
        run: |
          chmod +x gradlew
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew :app:assembleMusesRelease :app:assembleMiuiRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/muses-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.versionName=${{ steps.version.outputs.version }} \
            -Pandroid.injected.versionCode=$VERSION_CODE

      - name: Rename muses APK
        run: |
          mv app/build/outputs/apk/muses/release/app-muses-release.apk              muses-v${{ steps.version.outputs.version }}.apk

      - name: Rename miui APK
        run: |
          mv app/build/outputs/apk/miui/release/app-miui-release.apk              muses-v${{ steps.version.outputs.version }}-mi.apk

      # 说明由安卓 job 生成（有 checkout 可读 changelog）；MSI 文件名是确定性的
      - name: Read changelog
        run: |
          CHANGELOG_FILE="changelog/v${{ steps.version.outputs.version }}.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            cat "$CHANGELOG_FILE" >> release_body.md
          else
            echo "> 暂无更新日志" >> release_body.md
          fi
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "### 构建产物" >> release_body.md
          echo "- \`muses-v${{ steps.version.outputs.version }}.apk\` — 原生 Kotlin + Jetpack Compose（包名 \`com.muses.player\`）" >> release_body.md
          echo "- \`muses-v${{ steps.version.outputs.version }}-mi.apk\` — 包名 \`com.miui.player\`" >> release_body.md
          echo "- \`Muses-v${{ steps.version.outputs.version }}.msi\` — Windows 桌面端（Compose Desktop + jpackage）" >> release_body.md

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muses-android
          path: |
            muses-v${{ steps.version.outputs.version }}.apk
            muses-v${{ steps.version.outputs.version }}-mi.apk
            release_body.md

  # Windows 桌面端 MSI（Compose Desktop / jpackage），与安卓并行
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $TAG = "${{ github.ref }}" -replace '^refs/tags/', ''
          $VERSION = $TAG -replace '^v', ''
          "version=$VERSION" >> $env:GITHUB_OUTPUT
          "tag=$TAG" >> $env:GITHUB_OUTPUT

      # jpackage 需完整 JDK（含 jpackage.exe）：javaHome 经 MUSES_DESKTOP_JDK 指向
      # runner 的 JDK（setup-java 已导出 JAVA_HOME），本机硬编码路径仅作本地回落；
      # MSI 版本经 -Pmuses.desktop.version 注入（v0.4.10 → 0.4.10）；
      # -P 参数必须加引号：pwsh 会把 -P 开头解析为自己的参数，不加引号点号后的部分
      # 会被 Gradle 误认为任务名（Task '.desktop.version=x' not found）
      - name: Package Windows MSI
        shell: pwsh
        run: |
          $env:MUSES_DESKTOP_JDK = $env:JAVA_HOME
          ./gradlew.bat :composeApp:packageMsi "-Pmuses.desktop.version=${{ steps.version.outputs.version }}"

      # 通配符定位产物（jpackage 输出文件名细节可能随版本变化），找不到即显式失败
      - name: Rename MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main-release/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "未找到 MSI 产物" }
          Move-Item $msi.FullName "Muses-v${{ steps.version.outputs.version }}.msi"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: muses-windows
          path: Muses-v${{ steps.version.outputs.version }}.msi

  # 汇总发版：两端构建都成功后创建唯一 Release
  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-assets/muses-android/release_body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.apk
            release-assets/**/*.msi

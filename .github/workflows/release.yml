name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 安卓双渠道签名 APK：ubuntu 构建，产物经 artifact 交给 release 汇总
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Gradle 依赖与 wrapper 缓存：跳过每次冷启动的全量下载
          cache: 'gradle'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/muses-release.keystore

      # 签名与版本号经 AGP injected properties 注入：
      # versionName=tag；versionCode=提交总数（单调递增，须不低于旧 Capacitor 版）
      # 双渠道一条命令构建：共享配置阶段与 compile 任务，较两次独立构建显著提速
      - name: Build signed APKs (muses + miui)
        run: |
          chmod +x gradlew
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew :app:assembleMusesRelease :app:assembleMiuiRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/muses-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.versionName=${{ steps.version.outputs.version }} \
            -Pandroid.injected.versionCode=$VERSION_CODE

      - name: Rename muses APK
        run: |
          mv app/build/outputs/apk/muses/release/app-muses-release.apk              muses-v${{ steps.version.outputs.version }}.apk

      - name: Rename miui APK
        run: |
          mv app/build/outputs/apk/miui/release/app-miui-release.apk              muses-v${{ steps.version.outputs.version }}-mi.apk

      # 说明由安卓 job 生成（有 checkout 可读 changelog）；MSI 文件名是确定性的
      - name: Read changelog
        run: |
          CHANGELOG_FILE="changelog/v${{ steps.version.outputs.version }}.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            cat "$CHANGELOG_FILE" >> release_body.md
          else
            echo "> 暂无更新日志" >> release_body.md
          fi
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "### 构建产物" >> release_body.md
          echo "- \`muses-v${{ steps.version.outputs.version }}.apk\` — 安卓端（Compose Multiplatform 双端共享界面，包名 \`com.muses.player\`）" >> release_body.md
          echo "- \`muses-v${{ steps.version.outputs.version }}-mi.apk\` — 安卓端（Compose Multiplatform 双端共享界面，包名 \`com.miui.player\`）" >> release_body.md
          echo "- \`Muses-v${{ steps.version.outputs.version }}.msi\` — Windows 桌面端（Compose Multiplatform 双端共享界面 + jpackage）" >> release_body.md

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muses-android
          path: |
            muses-v${{ steps.version.outputs.version }}.apk
            muses-v${{ steps.version.outputs.version }}-mi.apk
            release_body.md

  # Windows 桌面端 MSI（Compose Multiplatform / jpackage），与安卓并行
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 内置播放引擎：VLC 3.0.21 win64 官方包（GPL 系，随包分发义务见 docs/THIRD_PARTY.md）。
      # 经 MUSES_VLC_ZIP 交给 scripts/prepare-vlc-runtime.ps1 解压 + 按 scripts/vlc-trim-keep.txt
      # 裁成纯音频最小集（182MB → 约 40MB）后进 jpackage 的 app/resources/vlc，
      # 让安装版免装 VLC 桌面版即可播放。
      # SHA256 已与官方 vlc-3.0.21-win64.zip.sha256 核对一致
      - name: Download VLC runtime
        shell: pwsh
        run: |
          $url = "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"
          $out = "$env:RUNNER_TEMP\vlc-3.0.21-win64.zip"
          $expected = "a0b7ec02b50adf6417eed014fb8df50af39690505a4225b85b3dc2ed17d14843"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 3 -RetryIntervalSec 5
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "VLC 包 SHA256 校验失败：$hash" }
          Write-Host "VLC 包就绪：$out"
          "MUSES_VLC_ZIP=$out" >> $env:GITHUB_ENV

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $TAG = "${{ github.ref }}" -replace '^refs/tags/', ''
          $VERSION = $TAG -replace '^v', ''
          "version=$VERSION" >> $env:GITHUB_OUTPUT
          "tag=$TAG" >> $env:GITHUB_OUTPUT

      # jpackage 需完整 JDK（含 jpackage.exe）：javaHome 经 MUSES_DESKTOP_JDK 指向
      # runner 的 JDK（setup-java 已导出 JAVA_HOME），本机硬编码路径仅作本地回落；
      # MSI 版本经 -Pmuses.desktop.version 注入（v0.4.10 → 0.4.10）；
      # -P 参数必须加引号：pwsh 会把 -P 开头解析为自己的参数，不加引号点号后的部分
      # 会被 Gradle 误认为任务名（Task '.desktop.version=x' not found）
      - name: Package Windows MSI
        shell: pwsh
        run: |
          $env:MUSES_DESKTOP_JDK = $env:JAVA_HOME
          ./gradlew.bat :composeApp:packageMsi "-Pmuses.desktop.version=${{ steps.version.outputs.version }}"

      # 内置 VLC 缺失时 prepareVlcRuntime 只告警不失败（本地无 VLC 源也能构建）：
      # 发版必须拦住，否则发布出去的就是用户报「未找到 VLC 播放引擎」的那个包
      - name: Verify bundled VLC
        shell: pwsh
        run: |
          $dll = "composeApp/build/appResources/windows/vlc/libvlc.dll"
          if (-not (Test-Path $dll)) { throw "内置 VLC 未产出：$dll（检查 MUSES_VLC_ZIP 与 scripts/vlc-trim.ps1）" }
          $size = (Get-ChildItem "composeApp/build/appResources/windows/vlc" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("内置 VLC 校验通过：{0:N1} MB" -f ($size / 1MB))

      # 通配符定位产物：输出目录随 CMP 版本可能是 main/ 或 main-release/，
      # 覆盖两种变体，找不到即显式失败
      - name: Rename MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/*/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "未找到 MSI 产物" }
          Move-Item $msi.FullName "Muses-v${{ steps.version.outputs.version }}.msi"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: muses-windows
          path: Muses-v${{ steps.version.outputs.version }}.msi

  # 汇总发版：两端构建都成功后创建唯一 Release
  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # ref_name 已含 v 前缀（v0.5.2），标题直接用，不再拼 v
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-assets/muses-android/release_body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.apk
            release-assets/**/*.msi
